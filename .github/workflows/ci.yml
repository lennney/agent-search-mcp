name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify offline evidence demo
        run: node benchmarks/evidence-demo.mjs

      - name: Test
        run: npm test

      - name: Verify persistent exact-cache prototype
        run: node benchmarks/exact-cache.mjs --check

      - name: Verify advisory query classifier
        run: node benchmarks/intent-routing.mjs --check

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify distribution metadata
        run: npm run distribution:check

      - name: Verify frozen benchmark fixture
        run: npm run benchmark:verify

      - name: Verify quality metric fixture
        run: npm run benchmark:quality:verify

      - name: Verify reviewer pilot artifacts
        run: npm run benchmark:reviewer-pilot:verify

      - name: Verify public capability matrix
        run: node scripts/generate-capability-matrix.mjs --check

  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify offline evidence demo
        run: node benchmarks/evidence-demo.mjs

      - name: Verify persistent exact-cache prototype
        run: node benchmarks/exact-cache.mjs --check

      - name: Verify advisory query classifier
        run: node benchmarks/intent-routing.mjs --check

      - name: Verify doctor on Windows
        shell: pwsh
        run: |
          $report = node dist/cli.js doctor --json | ConvertFrom-Json
          if ($report.schema_version -ne 'doctor-report-v1') {
            throw "Unexpected doctor schema: $($report.schema_version)"
          }
          if ($report.status -ne 'present') {
            throw "Doctor did not validate zero-key startup: $($report.status)"
          }

  experimental-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            experiments/mcp-2026/package-lock.json

      - name: Install stable dependencies
        run: npm ci --legacy-peer-deps

      - name: Install experimental dependencies
        run: npm ci --prefix experiments/mcp-2026

      - name: Test 2026 negotiation and stable fallback
        run: npm run experimental:2026:test

  release-preflight:
    needs: [build-and-test, quality, windows-build, experimental-2026]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.registry.outputs.already_published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Validate tag and exact npm version
        id: registry
        run: node scripts/release-registry.mjs

  publish:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci --legacy-peer-deps
      - name: Publish to npm
        if: needs.release-preflight.outputs.already_published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify exact version exists before downstream publication
        run: node scripts/release-registry.mjs --require-published

  docker:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare version-only image tag
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "tags=ghcr.io/${REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
